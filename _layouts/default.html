<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111216">
  <title>{% if page.title %}{{ page.title }} // {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
  {% seo %}
</head>
<body>
  <div class="site-frame">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="홈으로">
        <span class="brand-mark">DH</span><span class="brand-name">DEADHACKER<small>SECURITY OPERATIONS</small></span>
      </a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="메뉴 열기"><span></span><span></span></button>
      <nav class="site-nav" id="site-nav">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>HOME</a>
        <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' %}aria-current="page"{% endif %}>MISSIONS</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}aria-current="page"{% endif %}>PROFILE</a>
        <a class="nav-github" href="https://github.com/{{ site.github_username | default: 'YOUR_GITHUB_USERNAME' }}" target="_blank" rel="noopener">GITHUB ↗</a>
      </nav>
    </header>
    {{ content }}
    <footer class="site-footer">
      <a class="footer-brand" href="{{ '/' | relative_url }}">DH<span> / </span>DEADHACKER</a>
      <span>BUILT FOR CURIOSITY. RUN ON GITHUB PAGES.</span>
      <span class="footer-status"><i class="status-dot"></i> SYSTEM ONLINE</span>
    </footer>
  </div>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
